[project]
name = "ngs"
version = "0.1.0"
description = "Neural Graph Substrate: matched tests of recurrent self-routing neural graphs against looped and fixed-depth Transformers"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8"]
train = ["torch>=2.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ngs", "ngs.tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
